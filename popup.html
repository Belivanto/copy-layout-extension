<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Copy Layout</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Copy Layout</h1>
      <div class="lang-switch" role="group">
        <button type="button" class="lang-option" id="langTh">TH</button>
        <button type="button" class="lang-option" id="langEn">EN</button>
      </div>
    </div>
    <p class="subtitle" id="subtitle">Capture the current page's structure &amp; styles</p>
  </header>

  <main>
    <label class="option">
      <input type="checkbox" id="excludeImages" />
      <span id="excludeImagesLabel">ไม่รวมรูปภาพ (แทนที่ด้วยกล่องสีขาว)</span>
    </label>

    <label class="option">
      <input type="checkbox" id="pickElement" />
      <span id="pickElementLabel">เลือกเฉพาะ element (คลิกบนหน้าเว็บ)</span>
    </label>

    <label class="option">
      <input type="checkbox" id="includeHtml" />
      <span id="includeHtmlLabel">แนบ Layout HTML ไปกับ Prompt ด้วย</span>
    </label>

    <div class="actions">
      <button id="copyBtn" class="primary">Copy Layout</button>
      <button id="promptBtn">Copy Prompt</button>
      <button id="downloadBtn">Download HTML</button>
    </div>

    <p id="status" class="status" role="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
